# BD de desarrollo de Waypoint: MySQL + Redis.
# Lee las variables del .env de la raíz (copiar .env.example a .env).
# Levantar: docker compose up -d   |   Detener: docker compose down

name: waypoint

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Falta DB_ROOT_PASSWORD en el .env}
      MYSQL_DATABASE: ${DB_NAME:?Falta DB_NAME en el .env}
      MYSQL_USER: ${DB_USER:?Falta DB_USER en el .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el .env}
    ports:
      # Solo desde esta computadora, no desde la red
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql_datos:/var/lib/mysql
    healthcheck:
      # Por TCP, para no dar por listo al servidor temporal de la primera inicialización
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # appendonly: guarda en disco para que las sesiones sobrevivan a un reinicio
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Falta REDIS_PASSWORD en el .env}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_datos:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_datos:
  redis_datos:
